[pytest]
DJANGO_SETTINGS_MODULE = backend.settings
python_files = tests.py test_*.py tests_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
markers =
    unit: Unit tests
    integration: Integration tests
    permissions: Permission tests
    slow: Slow running tests
    api: API tests
    models: Model tests
    services: Service tests
    views: View tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# NOTE: the original mediaJira pytest.ini also configured pytest-xdist
# (-n auto), pytest-rerunfailures (--reruns), pytest-timeout, pytest-asyncio,
# and per-app coverage gates for apps not in this project. Trimmed down here
# - see README "Known simplifications". Install those plugins yourself if you
# want the original parallel/rerun/coverage behavior.
